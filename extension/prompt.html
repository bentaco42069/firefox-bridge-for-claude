<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Claude Firefox Bridge — Pro search</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: #0e0e10; color: #f4e9c9;
    font: 16px/1.5 system-ui, "Segoe UI", sans-serif;
  }
  .card {
    width: min(560px, 92vw); background: #17171a;
    border: 1px solid #3a2f10; border-radius: 16px;
    padding: 34px 30px; text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,.6);
  }
  h1 { margin: 0 0 8px; font-size: 22px; color: #ffce3a; letter-spacing: .3px; }
  p  { margin: 6px 0 24px; color: #c9c4b4; }
  .btns { display: flex; gap: 14px; justify-content: center; }
  button {
    flex: 1; max-width: 220px; cursor: pointer; border: 0; border-radius: 12px;
    padding: 16px 14px; font-size: 16px; font-weight: 700;
    transition: background .12s ease;
  }
  .yes { background: #ffce3a; color: #1a1400; }
  .yes:hover { background: #ffd95e; }
  .no  { background: #2a2a2e; color: #f0ede4; border: 1px solid #4a4a50; }
  .no:hover { background: #34343a; }
  .cur { margin-top: 18px; font-size: 13px; color: #8f8a7c; }
  .done { color: #ffce3a; font-weight: 700; font-size: 17px; }
</style>
</head>
<body>
  <div class="card">
    <h1>Send Google searches through Pro?</h1>
    <p>Firefox opened as Claude's tool. Pick one and it closes.<br>
       <b>Yes</b> routes your Google searches through AI&nbsp;Mode (Pro). <b>No</b> keeps normal Google.</p>
    <div class="btns" id="btns">
      <button class="yes" id="yes">YES — Pro on</button>
      <button class="no"  id="no">NO — normal Google</button>
    </div>
    <div class="cur" id="cur"></div>
  </div>
  <script src="prompt.js"></script>
</body>
</html>
